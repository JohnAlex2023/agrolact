<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="enviar()">
    <div class="marca">
      <app-logo [size]="52" />
      <h1>AgroLact</h1>
    </div>
    <p class="subtitulo">Iniciar sesion</p>

    <label for="email">Correo electronico</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" />
    @if (form.controls.email.invalid && form.controls.email.touched) {
      <span class="campo-error">Ingresa un correo valido</span>
    }

    <label for="password">Contrasena</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.invalid && form.controls.password.touched) {
      <span class="campo-error">La contrasena es requerida</span>
    }

    @if (error()) {
      <p class="error-general">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
